<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kunai Legacy 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--accent:#ff6a1a;--accent2:#ffcf5c;--blue:#38c8ff;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Noto Sans JP',sans-serif;color:#fff;}
  canvas{display:block;}
  .screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
    opacity:0;pointer-events:none;transition:opacity .8s ease;z-index:10;}
  .screen.active{opacity:1;pointer-events:auto;}
  #intro{background:radial-gradient(circle at 50% 25%,#3a1a0a,#000 75%);}
  #introLogo{font-family:'Bebas Neue',sans-serif;font-size:4.2em;letter-spacing:.15em;
    background:linear-gradient(180deg,var(--accent2),var(--accent));-webkit-background-clip:text;
    background-clip:text;color:transparent;text-shadow:0 0 40px rgba(255,106,26,.6);}
  #introSub{letter-spacing:.5em;color:#c98;margin-top:-4px;font-size:.8em;}
  #credits{margin-top:20px;letter-spacing:.15em;color:#875;font-size:.7em;}
  #credits span{color:var(--accent2);}
  .stylBtn{margin-top:30px;padding:14px 38px;background:linear-gradient(135deg,var(--accent),#c8440d);
    border:none;border-radius:3px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);
    color:#fff;font-family:'Bebas Neue',sans-serif;letter-spacing:.15em;font-size:1.2em;cursor:pointer;
    box-shadow:0 0 20px rgba(255,106,26,.5);}
  #cutscene{background:linear-gradient(#1a0f05,#000 85%);}
  .silhouette{width:70px;height:145px;position:absolute;bottom:24%;border-radius:22px 22px 0 0;
    background:linear-gradient(#221812,#000);box-shadow:0 0 30px rgba(255,106,26,.25);}
  #dad{left:37%;} #son{left:57%;height:115px;box-shadow:0 0 30px rgba(56,200,255,.2);}
  .hair{position:absolute;top:-28px;left:50%;transform:translateX(-50%);width:76px;height:36px;}
  .minato .hair{background:#ffd23f;clip-path:polygon(50% 0%,18% 100%,34% 55%,2% 95%,28% 42%,50% 85%,72% 42%,98% 95%,66% 55%,82% 100%);
    filter:drop-shadow(0 0 6px rgba(255,210,63,.5));}
  .naruto .hair{background:#ff9d1f;clip-path:polygon(50% 0%,20% 100%,36% 55%,4% 92%,30% 40%,50% 82%,70% 40%,96% 92%,64% 55%,80% 100%);
    filter:drop-shadow(0 0 6px rgba(255,157,31,.5));}
  .headband{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:52px;height:9px;
    background:#2b6cff;border-top:2px solid #d8e0ea;border-bottom:2px solid #d8e0ea;}
  .headband::after{content:'';position:absolute;left:50%;top:-2px;transform:translateX(-50%);
    width:12px;height:12px;background:#c9d3dd;border-radius:1px;}
  #kunaiPass{position:absolute;bottom:33%;left:47%;width:18px;height:5px;background:#fff;border-radius:2px;
    box-shadow:0 0 14px #fff;opacity:0;}
  #dialogueBox{position:absolute;bottom:6%;width:82%;max-width:660px;background:rgba(10,6,3,.75);
    border:1px solid var(--accent);border-radius:4px;padding:18px 22px;min-height:74px;font-size:1.05em;}
  #dSpeaker{color:var(--accent2);font-family:'Bebas Neue',sans-serif;letter-spacing:.1em;font-size:1.1em;display:block;margin-bottom:6px;}
  #skipBtn{position:absolute;top:18px;right:18px;background:rgba(0,0,0,.4);border:1px solid #a86;color:#dcc;
    padding:7px 16px;border-radius:20px;cursor:pointer;}
  #hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;
    z-index:5;font-size:.9em;pointer-events:none;}
  .hudBox{background:rgba(0,0,0,.5);border:1px solid rgba(255,106,26,.4);border-radius:6px;padding:8px 14px;}
  .bar{width:200px;height:12px;background:#111;border:1px solid #444;border-radius:6px;overflow:hidden;margin-top:5px;}
  .bar>div{height:100%;transition:width .2s;}
  #healthFill{background:linear-gradient(90deg,#ff3b3b,#ff9a3b);width:100%;}
  #powerFill{background:linear-gradient(90deg,#1a7fd6,#38c8ff);width:0%;}
  #killCount{color:var(--accent2);font-weight:bold;}
  #specialFlash{position:absolute;inset:0;background:radial-gradient(circle,rgba(56,200,255,.55),transparent 70%);
    opacity:0;pointer-events:none;z-index:6;}
  #lightning{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6;}
  #weatherRow{position:absolute;top:70px;left:14px;display:flex;gap:8px;z-index:5;}
  .wBtn{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3);color:#eee;border-radius:14px;
    padding:5px 12px;font-size:.78em;cursor:pointer;}
  .wBtn.active{background:var(--accent);border-color:var(--accent2);color:#111;font-weight:bold;}
  #comboText{position:absolute;top:26%;left:50%;transform:translate(-50%,-50%) scale(0.3);
    font-family:'Bebas Neue',sans-serif;font-size:3.2em;letter-spacing:.08em;color:var(--accent2);
    text-shadow:0 0 18px var(--accent),0 0 40px var(--accent); opacity:0; pointer-events:none;z-index:7;}
  #comboText.pop{animation:comboPop .9s ease-out;}
  @keyframes comboPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-6deg);}
    15%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(2deg);}
    30%{transform:translate(-50%,-50%) scale(1) rotate(0deg);}
    75%{opacity:1;} 100%{opacity:0;transform:translate(-50%,-50%) scale(1) translateY(-20px);}}
  #controlsHint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:.8em;color:#7d9;z-index:5;}
  #btnRow{position:absolute;bottom:20px;right:20px;display:flex;gap:12px;z-index:5;}
  .actionBtn{width:66px;height:66px;border-radius:50%;border:2px solid var(--accent2);
    background:radial-gradient(circle,rgba(255,106,26,.35),rgba(0,0,0,.6));color:#fff;
    font-family:'Bebas Neue',sans-serif;font-size:.85em;cursor:pointer;}
  #end{background:radial-gradient(circle at 50% 40%,#1a0f05,#000 75%);}
  #endTitle{font-family:'Bebas Neue',sans-serif;font-size:2.4em;letter-spacing:.1em;color:var(--accent2);
    text-shadow:0 0 24px var(--accent);margin-bottom:10px;}
  #endStats{color:#cca;margin-bottom:20px;}
</style>
</head>
<body>

<div id="intro" class="screen active">
  <div id="introLogo">KUNAI LEGACY</div>
  <div id="introSub">WILL OF FIRE — 3D</div>
  <button class="stylBtn" id="startBtn">BEGIN</button>
  <div id="credits">CREATED BY <span>D.SUPREETH</span> &amp; <span>K.HARIHARAN</span></div>
</div>

<div id="cutscene" class="screen">
  <button id="skipBtn">SKIP ▶</button>
  <div id="dad" class="silhouette minato"><div class="hair"></div></div>
  <div id="son" class="silhouette naruto"><div class="hair"></div><div class="headband"></div></div>
  <div id="kunaiPass"></div>
  <div id="dialogueBox"><span id="dSpeaker"></span><span id="dText"></span></div>
</div>

<div id="game" class="screen">
  <div id="hud">
    <div class="hudBox">Health<div class="bar"><div id="healthFill"></div></div></div>
    <div class="hudBox">Kills <span id="killCount">0</span> / 15</div>
    <div class="hudBox">Power<div class="bar"><div id="powerFill"></div></div></div>
  </div>
  <div id="weatherRow">
    <button class="wBtn" data-w="sunny">☀ Sunny</button>
    <button class="wBtn" data-w="rain">🌧 Rain</button>
    <button class="wBtn" data-w="storm">⛈ Storm</button>
  </div>
  <div id="lightning"></div>
  <div id="specialFlash"></div>
  <div id="comboText"></div>
  <div id="controlsHint">WASD MOVE · SPACE THROW · Q SPECIAL (power full)</div>
  <div id="btnRow">
    <button class="actionBtn" id="atkBtn">THROW</button>
    <button class="actionBtn" id="specBtn">SPECIAL</button>
  </div>
</div>

<div id="end" class="screen">
  <div id="endTitle"></div>
  <div id="endStats"></div>
  <button class="stylBtn" id="startBtn2">PLAY AGAIN</button>
  <div id="credits">CREATED BY <span>D.SUPREETH</span> &amp; <span>K.HARIHARAN</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const screens = {intro:$('intro'), cutscene:$('cutscene'), game:$('game'), end:$('end')};
function show(name){ Object.values(screens).forEach(s=>s.classList.remove('active')); screens[name].classList.add('active'); }

/* ---------- Cutscene ---------- */
const lines = [
  {who:'Minato', text:'This kunai carried me through every battle. Today, it is yours.'},
  {who:'Minato', text:'A blade alone means nothing. It is the will behind it that protects people.'},
  {who:'Naruto', text:"I won't let that will fade, Dad. I'll protect everyone I can."},
  {who:'Minato', text:'Then go. The village is counting on you now.'}
];
let lineIdx = 0, cutsceneTimer;
function playCutscene(){
  show('cutscene'); lineIdx = 0;
  $('kunaiPass').style.transition='none'; $('kunaiPass').style.opacity=0;
  setTimeout(()=>{ $('kunaiPass').style.transition='opacity 1s, left 3s ease'; $('kunaiPass').style.opacity=1; $('kunaiPass').style.left='53%'; }, 400);
  nextLine();
}
function nextLine(){
  clearTimeout(cutsceneTimer);
  if(lineIdx>=lines.length){ startGame(); return; }
  const l = lines[lineIdx++];
  $('dSpeaker').textContent = l.who + ': ';
  $('dText').textContent = l.text;
  cutsceneTimer = setTimeout(nextLine, 4700);
}
$('skipBtn').onclick = () => { clearTimeout(cutsceneTimer); startGame(); };
$('startBtn').onclick = playCutscene;
$('startBtn2').onclick = () => show('intro');

/* ---------- Three.js scene ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1410);
scene.fog = new THREE.Fog(0x0a1410, 20, 55);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
window.addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

scene.add(new THREE.AmbientLight(0xffffff, 0.45));
const sun = new THREE.DirectionalLight(0xffe8c8, 1.1);
sun.position.set(15, 25, 10); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-30; sun.shadow.camera.right=30; sun.shadow.camera.top=30; sun.shadow.camera.bottom=-30;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x6699ff, 0.35);
rim.position.set(-10,8,-10); scene.add(rim);

// Ground
function gridTex(){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const ctx=c.getContext('2d'); ctx.fillStyle='#173322'; ctx.fillRect(0,0,256,256);
  ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=2;
  for(let i=0;i<=256;i+=32){ ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,256);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(256,i);ctx.stroke(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(20,20); return t;
}
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80,80), new THREE.MeshStandardMaterial({map:gridTex(), roughness:0.95}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

// Mountains (background silhouettes)
const mtnMat = new THREE.MeshStandardMaterial({color:0x2b2440, roughness:1});
for(let i=0;i<12;i++){
  const h=16+Math.random()*20, r=11+Math.random()*15;
  const cone=new THREE.Mesh(new THREE.ConeGeometry(r,h,6), mtnMat);
  const ang=(i/12)*Math.PI*2+Math.random()*0.3, dist=58+Math.random()*16;
  cone.position.set(Math.cos(ang)*dist, h/2-2, Math.sin(ang)*dist);
  cone.rotation.y=Math.random()*Math.PI;
  scene.add(cone);
}

// Rain particles
const RAIN_COUNT=700;
const rainPos = new Float32Array(RAIN_COUNT*3);
for(let i=0;i<RAIN_COUNT;i++){ rainPos[i*3]=(Math.random()-0.5)*70; rainPos[i*3+1]=Math.random()*40; rainPos[i*3+2]=(Math.random()-0.5)*70; }
const rainGeo = new THREE.BufferGeometry(); rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos,3));
const rainMat = new THREE.PointsMaterial({color:0xaaccff, size:0.14, transparent:true, opacity:0.65});
const rain = new THREE.Points(rainGeo, rainMat); rain.visible=false; scene.add(rain);

let weather='sunny', stormActive=false;
function setWeather(mode){
  weather=mode;
  document.querySelectorAll('.wBtn').forEach(b=>b.classList.toggle('active', b.dataset.w===mode));
  if(mode==='sunny'){ scene.background.set(0x8fc7ff); scene.fog.color.set(0xbfd8ff); scene.fog.near=25; scene.fog.far=75;
    sun.color.set(0xfff2d0); sun.intensity=1.2; rain.visible=false; stormActive=false; }
  else if(mode==='rain'){ scene.background.set(0x232b30); scene.fog.color.set(0x33404a); scene.fog.near=10; scene.fog.far=42;
    sun.color.set(0xaabbcc); sun.intensity=0.5; rain.visible=true; stormActive=false; }
  else if(mode==='storm'){ scene.background.set(0x1c0707); scene.fog.color.set(0x2a0d0d); scene.fog.near=8; scene.fog.far=46;
    sun.color.set(0xff5533); sun.intensity=0.6; rain.visible=true; stormActive=true; }
}
document.querySelectorAll('.wBtn').forEach(b=> b.onclick = ()=> setWeather(b.dataset.w));
setWeather('sunny');
function lightningFlash(){
  const el=$('lightning'); el.style.transition='opacity .06s'; el.style.opacity=0.85;
  setTimeout(()=>{ el.style.transition='opacity .35s'; el.style.opacity=0; }, 70);
}

/* ---------- Humanoid builder ---------- */
function buildHumanoid(skin, cloth, withArms){
  const g = new THREE.Group();
  const mSkin = new THREE.MeshStandardMaterial({color:skin, roughness:0.6});
  const mCloth = new THREE.MeshStandardMaterial({color:cloth, roughness:0.7});
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.34,0.75,10), mCloth);
  torso.position.y=1.15; torso.castShadow=true; g.add(torso);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.24,12,12), mSkin);
  head.position.y=1.75; head.castShadow=true; g.add(head);
  function limb(x,y,z,color){
    const pivot = new THREE.Group(); pivot.position.set(x,y,z);
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,0.6,8), new THREE.MeshStandardMaterial({color,roughness:0.65}));
    mesh.position.y=-0.32; mesh.castShadow=true; pivot.add(mesh); g.add(pivot); return pivot;
  }
  const legL = limb(-0.16,0.88,0, cloth); const legR = limb(0.16,0.88,0, cloth);
  let armL=null, armR=null;
  if(withArms){ armL = limb(-0.42,1.42,0, skin); armR = limb(0.42,1.42,0, skin); }
  g.castShadow = true;
  return {group:g, legL, legR, armL, armR};
}

const player3D = buildHumanoid(0xffcf9c, 0xff6a1a, true);
player3D.group.position.set(0,0,0);
scene.add(player3D.group);

/* ---------- Game state ---------- */
let px=0, pz=0, angle=0, health=100, kills=0, power=0, running=false;
let killStreak=0, lastKillTime=0;
const keys = {};
const enemies = [];
const kunais = [];
const ARENA = 26, SPEED = 6.2;
const clock = new THREE.Clock();

function startGame(){
  show('game'); running=true;
  px=0; pz=0; angle=0; health=100; kills=0; power=0; killStreak=0;
  $('killCount').textContent=0; $('healthFill').style.width='100%'; $('powerFill').style.width='0%';
  enemies.forEach(e=>scene.remove(e.rig.group)); enemies.length=0;
  kunais.forEach(k=>scene.remove(k.mesh)); kunais.length=0;
  for(let i=0;i<4;i++) spawnEnemy();
  clock.getDelta();
  renderer.setAnimationLoop(loop);
}
function spawnEnemy(){
  const rig = buildHumanoid(0xffb3a3, 0x8a1414, false);
  let ex,ez;
  do{ ex=(Math.random()-0.5)*ARENA*1.8; ez=(Math.random()-0.5)*ARENA*1.8; }while(Math.hypot(ex-px,ez-pz)<9);
  rig.group.position.set(ex,0,ez);
  scene.add(rig.group);
  enemies.push({rig, x:ex, z:ez, alive:true});
}

window.addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key===' '){ e.preventDefault(); throwKunai(); }
  if(e.key.toLowerCase()==='q'){ useSpecial(); }
});
window.addEventListener('keyup', e=> keys[e.key.toLowerCase()]=false);
$('atkBtn').onclick = throwKunai;
$('specBtn').onclick = useSpecial;

let attackAnim = 0;
function loop(){
  if(!running) return;
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = performance.now()/1000;
  let dx=0, dz=0;
  if(keys['w']) dz -= 1;
  if(keys['s']) dz += 1;
  if(keys['a']) dx -= 1;
  if(keys['d']) dx += 1;
  const moving = dx||dz;
  if(moving){
    const len=Math.hypot(dx,dz); dx/=len; dz/=len;
    px = Math.max(-ARENA, Math.min(ARENA, px+dx*SPEED*dt));
    pz = Math.max(-ARENA, Math.min(ARENA, pz+dz*SPEED*dt));
    angle = Math.atan2(dx,dz);
  }
  player3D.group.position.set(px,0,pz);
  player3D.group.rotation.y = angle;
  const walkT = moving ? t*9 : 0;
  player3D.legL.rotation.x = Math.sin(walkT)*0.6;
  player3D.legR.rotation.x = -Math.sin(walkT)*0.6;
  if(attackAnim>0){ attackAnim -= dt; player3D.armR.rotation.x = -1.8 + (0.3-attackAnim)*2; }
  else { player3D.armR.rotation.x = Math.sin(walkT)*-0.4; player3D.armL.rotation.x = Math.sin(walkT)*0.4; }

  enemies.forEach(en=>{
    if(!en.alive) return;
    const d = Math.hypot(px-en.x, pz-en.z);
    if(d>1.3){ en.x += (px-en.x)/d*2.2*dt; en.z += (pz-en.z)/d*2.2*dt; }
    else { health -= 22*dt; $('healthFill').style.width = Math.max(0,health)+'%'; }
    en.rig.group.position.set(en.x,0,en.z);
    en.rig.group.rotation.y = Math.atan2(px-en.x, pz-en.z);
    const wt = t*8;
    en.rig.legL.rotation.x = Math.sin(wt)*0.6; en.rig.legR.rotation.x = -Math.sin(wt)*0.6;
  });

  // kunai movement
  for(let i=kunais.length-1;i>=0;i--){
    const k = kunais[i];
    k.x += k.dx*22*dt; k.z += k.dz*22*dt; k.dist += 22*dt;
    k.mesh.position.set(k.x,1.15,k.z);
    let hit=false;
    enemies.forEach(en=>{ if(en.alive && Math.hypot(k.x-en.x,k.z-en.z)<1.1){ killEnemy(en); hit=true; } });
    if(hit || k.dist>24){ scene.remove(k.mesh); kunais.splice(i,1); }
  }

  // chase camera
  const camOff = new THREE.Vector3(Math.sin(angle)*-6, 4.2, Math.cos(angle)*-6);
  const desired = new THREE.Vector3(px+camOff.x, camOff.y, pz+camOff.z);
  camera.position.lerp(desired, 0.08);
  camera.lookAt(px, 1.3, pz);

  if(rain.visible){
    const arr = rainGeo.attributes.position.array;
    for(let i=0;i<RAIN_COUNT;i++){ arr[i*3+1] -= (stormActive?28:16)*dt; if(arr[i*3+1]<0) arr[i*3+1]=40; }
    rainGeo.attributes.position.needsUpdate = true;
  }
  if(stormActive && Math.random()<0.006) lightningFlash();

  if(health<=0){ endGame(false); return; }
  renderer.render(scene, camera);
}

function throwKunai(){
  if(!running) return;
  attackAnim = 0.3;
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.08,0.08), new THREE.MeshStandardMaterial({color:0xeeeeee, emissive:0x664422}));
  mesh.position.set(px,1.15,pz);
  scene.add(mesh);
  kunais.push({mesh, x:px, z:pz, dx:Math.sin(angle), dz:Math.cos(angle), dist:0});
}

function killEnemy(en){
  en.alive=false; scene.remove(en.rig.group);
  kills++; $('killCount').textContent=kills;
  power = Math.min(100, power+18); $('powerFill').style.width=power+'%';
  registerComboKill();
  setTimeout(spawnEnemy, 500);
  if(kills>=15) endGame(true);
}

function registerComboKill(){
  const now = performance.now();
  if(now - lastKillTime < 1300) killStreak++; else killStreak = 1;
  lastKillTime = now;
  if(killStreak>=2){
    const labels = {2:'DOUBLE KILL!',3:'TRIPLE KILL!',4:'MEGA KILL!',5:'ULTRA KILL!'};
    const text = labels[killStreak] || 'RAMPAGE!!';
    const el = $('comboText'); el.textContent = text;
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  }
}

function useSpecial(){
  if(power<100 || !running) return;
  power=0; $('powerFill').style.width='0%';
  $('specialFlash').style.transition='opacity .1s'; $('specialFlash').style.opacity=1;
  setTimeout(()=>{ $('specialFlash').style.transition='opacity .7s'; $('specialFlash').style.opacity=0; }, 180);
  enemies.slice().forEach(en=>{ if(en.alive && Math.hypot(px-en.x,pz-en.z)<11) killEnemy(en); });
}

function endGame(won){
  running=false; renderer.setAnimationLoop(null);
  $('endTitle').textContent = won ? 'VICTORY — WILL OF FIRE' : 'YOU FELL IN BATTLE';
  $('endStats').textContent = `Enemies defeated: ${kills}`;
  show('end');
}
</script>
</body>
</html>
